<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B84A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9922E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A67B1F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pyramidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9922E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A67B1F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#141414" rx="12"/>
  
  <!-- Sun -->
  <circle cx="32" cy="16" r="10" fill="url(#goldGradient)" filter="url(#glow)"/>
  
  <!-- Horizon Line -->
  <line x1="8" y1="40" x2="56" y2="40" stroke="url(#goldGradient)" stroke-width="1.5"/>
  
  <!-- Pyramid Left -->
  <polygon points="32,40 8,40 20,16" fill="url(#pyramidGradient)" opacity="0.9"/>
  
  <!-- Pyramid Right -->
  <polygon points="32,40 56,40 44,16" fill="url(#pyramidGradient)" opacity="0.7"/>
</svg>
